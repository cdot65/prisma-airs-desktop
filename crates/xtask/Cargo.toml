[package]
name = "xtask"
version = "0.1.0"
description = "Build-time check, review and artifact controller for Prisma AIRS Desktop v2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Exposes deterministic controller fixtures to its integration tests.
test-fixtures = []

[dependencies]
desktop-core = { path = "../desktop-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[[test]]
name = "shell_controller"
required-features = ["test-fixtures"]
